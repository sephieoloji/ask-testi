<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Beni Seviyor musun?</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.container {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 20px;
}

h1 {
    color: #ff4d6d;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

#yesBtn {
    background: green;
    color: white;
}

#noBtn {
    background: red;
    color: white;
}

#message {
    margin-top: 15px;
    color: #ff4d6d;
    font-size: 16px;
}
</style>

</head>
<body>

<div class="container" id="container">
    <h1>Umutcum beni seviyor musun? 💖</h1>

    <div class="buttons">
        <button id="yesBtn">EVET TABİİ Kİ</button>
        <button id="noBtn">HAYIR!!!</button>
    </div>

    <!-- MESAJ ALANI EKLENDİ -->
    <div id="message"></div>
</div>

<script>
window.onload = function() {

    let yesBtn = document.getElementById("yesBtn");
    let noBtn = document.getElementById("noBtn");
    let container = document.getElementById("container");
    let message = document.getElementById("message");

    let noCount = 0;
    let scale = 1;

    function showLove() {
        document.body.innerHTML = "<h1 style='text-align:center; color:white; font-size:40px;'>AY AŞKIM BEN DE SENİ SEVİYORUMM 💕</h1>";
        document.body.style.background = "linear-gradient(135deg,#ff4d6d,#ff9a9e)";
    }

    yesBtn.onclick = showLove;

    noBtn.onclick = function() {
        noCount++;

        // ✅ SADECE İLK TIKTA MESAJ
        if (noCount === 1) {
            message.innerText = "İstersen bir daha dene aşkım 😇";
        }

        // evet büyür
        scale += 0.2;
        yesBtn.style.transform = "scale(" + scale + ")";

        // 5. tıklama → dev evet
        if (noCount >= 5) {
            container.innerHTML = "";

            let bigBtn = document.createElement("button");
            bigBtn.innerText = "EVET TABİİ Kİ";

            document.body.style.margin = "0";
            document.body.style.padding = "0";

            bigBtn.style.position = "fixed";
            bigBtn.style.top = "0";
            bigBtn.style.left = "0";
            bigBtn.style.width = "100%";
            bigBtn.style.height = "100%";

            bigBtn.style.fontSize = "40px";
            bigBtn.style.background = "green";
            bigBtn.style.color = "white";
            bigBtn.style.border = "none";

            bigBtn.onclick = showLove;

            document.body.appendChild(bigBtn);
            return;
        }

        // hayır kaçsın
        let x = Math.random() * (window.innerWidth - 100);
        let y = Math.random() * (window.innerHeight - 50);

        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    };

};
</script>

</body>
  </html>
